name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"  # weekly: catches breakage from model or index updates

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu  # CPU-only torch
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  lint-and-test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: pip install -r requirements-lock.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests (no model downloads, no LLM calls)
        run: pytest --cov --cov-report=term-missing:skip-covered

  integration:
    name: Integration tests (real ML models)
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('config/settings.py') }}
      - run: pip install -r requirements-lock.txt
      - name: Integration tests
        run: pytest -m integration

  docker:
    name: Docker image build + smoke test
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image (not pushed)
        run: docker build -t knowledge-assistant:ci .
      - name: Start API container
        run: |
          mkdir -p ci-data
          chmod 777 ci-data
          docker run -d --name kb -p 8000:8000 -v "$PWD/ci-data:/app/data" knowledge-assistant:ci
      - name: Wait until healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' kb)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          docker logs kb
          exit 1
      - name: Smoke test (upload, search, delete)
        run: |
          set -euo pipefail
          printf 'Employees get twenty-five days of paid annual leave per year.\n' > leave.txt
          curl -fsS -F "file=@leave.txt" http://127.0.0.1:8000/api/documents
          curl -fsS -X POST http://127.0.0.1:8000/api/search \
               -H "Content-Type: application/json" \
               -d '{"query": "How many vacation days do I get?"}' | tee search.json
          grep -q '"source":"leave.txt"' search.json
          curl -fsS -X DELETE http://127.0.0.1:8000/api/documents/leave.txt
          # /ask without an API key must fail cleanly with 503, not crash
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/ask \
                 -H "Content-Type: application/json" -d '{"question": "anything"}')
          echo "ask without key: HTTP $code"
          [ "$code" = "200" ] || [ "$code" = "503" ]
      - name: Container runs as non-root
        run: test "$(docker exec kb id -u)" != "0"
      - name: Logs
        if: always()
        run: docker logs kb || true
