# API + chat UI.   docker compose up --build   then open http://127.0.0.1:8501
#
# - Documents and the index live in ./data on the host (bind mount), so they
#   survive container rebuilds.
# - Settings come from .env (optional). The API key is passed at runtime and is
#   never part of the image.
# - Ports are bound to 127.0.0.1: reachable from this computer only.

services:
  api:
    build: .
    image: knowledge-assistant:latest
    env_file:
      - path: .env
        required: false
    environment:
      DOCUMENTS_DIR: /app/data/documents
      PROCESSED_DIR: /app/data/processed
      # With LLM_PROVIDER=ollama: reach Ollama running on the host computer
      # ("localhost" inside a container is the container itself).
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"  # needed on Linux; Docker Desktop has it built in
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  ui:
    build: .  # same image as the api service; the second build is fully cached
    image: knowledge-assistant:latest
    command: ["streamlit", "run", "ui/streamlit_app.py"]
    environment:
      API_URL: http://api:8000
      # Inside the container Streamlit must listen on all interfaces; the port
      # mapping below still restricts access to this computer.
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    restart: unless-stopped
