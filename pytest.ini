[pytest]
# Put the project root on sys.path so tests can `import rag`, `import config`, ...
pythonpath = .
testpaths = tests
# Opt-in tests:  pytest -m integration  (real ML models)   pytest -m llm  (real LLM API, costs tokens)
addopts = -ra -m "not integration and not llm"
markers =
    integration: needs real ML models (downloads on first run, slower)
    llm: calls the configured LLM provider (needs OPENAI_API_KEY or a running Ollama)
